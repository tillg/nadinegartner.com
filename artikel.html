<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Artikel von Nadine Gartner zu Public Speaking, Kommunikation und interkulturellen Themen.">
{BLOCK}
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="Hauptnavigation">
      <a class="brand" href="index.html">Nadine <span>Gartner</span></a>
      <div class="nav-links">
        <a href="index.html">Start</a>
        <a href="ueber-mich.html">Wer bin ich</a>
        <a href="angebot.html">Angebot</a>
        <a href="artikel.html" aria-current="page">Artikel</a>
        <a href="https://starkesdach.de/" target="_blank" rel="noopener">Starkes Dach ↗</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="wrap prose">
        <p class="eyebrow">Artikel</p>
        <h1>Gedanken &amp; Themen</h1>
        <p class="lead muted">Beiträge zu Public Speaking, Kommunikation und interkulturellen Themen.</p>
      </div>
    </section>

    <section class="block">
      <div class="wrap">
        <div id="liste" class="article-list">
          <p class="muted">Lade Artikel …</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div>© <span class="jahr">2026</span> Nadine Gartner</div>
      <div>
        <a href="impressum.html">Impressum</a> ·
        <a href="#" class="ph">[Datenschutz]</a> ·
        <a href="https://starkesdach.de/" target="_blank" rel="noopener">Starkes Dach</a>
      </div>
    </div>
  </footer>

  <script src="js/articles.js"></script>
  <script>
    document.querySelectorAll('.jahr').forEach(e => e.textContent = new Date().getFullYear());
    (async () => {
      const box = document.getElementById('liste');
      const arts = await fetchArticles();
      if (!arts.length) {
        box.innerHTML = '<p class="muted">Noch keine Artikel veröffentlicht.</p>';
        return;
      }
      box.innerHTML = arts.map(articleCardHTML).join('');
    })();
  </script>
</body>
</html>
